name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: crates-io-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag matches workspace version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)
          test -n "$version"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
            exit 1
          fi

      - name: Check workspace
        run: cargo check --workspace --all-features --locked

      - name: Verify crates can be packaged
        shell: bash
        run: |
          packages=(
            scafra-foundation
            scafra-core
            scafra-actuator
            scafra-scheduler
            scafra-security
            scafra-macros
            scafra-config
            scafra-web
            scafra-build
            scafra-bootui
            scafra-cli
            scafra
          )
          for package in "${packages[@]}"; do
            cargo package --package "$package" --locked --list >/dev/null
          done

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || {
            echo "Repository secret CRATES_IO_TOKEN is required" >&2
            exit 1
          }

          packages=(
            scafra-foundation
            scafra-core
            scafra-actuator
            scafra-scheduler
            scafra-security
            scafra-macros
            scafra-config
            scafra-web
            scafra-build
            scafra-bootui
            scafra-cli
            scafra
          )
          for package in "${packages[@]}"; do
            if (cd "$RUNNER_TEMP" && cargo info --registry crates-io "$package@${RELEASE_VERSION#v}" >/dev/null 2>&1); then
              echo "$package ${RELEASE_VERSION#v} is already published; skipping"
              continue
            fi
            echo "Publishing $package"
            cargo publish --package "$package" --locked
          done
