[workspace]
resolver = "2"
members = [
    "crates/ember",
    "crates/ember-core",
    "crates/ember-foundation",
    "crates/ember-macros",
    "crates/ember-actuator",
    "crates/ember-scheduler",
    "crates/ember-security",
    "crates/ember-web",
    "crates/ember-config",
    "crates/ember-cli",
    "crates/ember-build",
    "crates/ember-bootui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ember-rs/ember"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
ember = { package = "ember-framework", path = "crates/ember", version = "0.1.0" }
ember-build = { package = "ember-framework-build", path = "crates/ember-build", version = "0.1.0" }
ember-bootui = { package = "ember-framework-bootui", path = "crates/ember-bootui", version = "0.1.0" }
ember-config = { package = "ember-framework-config", path = "crates/ember-config", version = "0.1.0" }
ember-core = { package = "ember-framework-core", path = "crates/ember-core", version = "0.1.0" }
ember-foundation = { package = "ember-framework-foundation", path = "crates/ember-foundation", version = "0.1.0" }
ember-macros = { package = "ember-framework-macros", path = "crates/ember-macros", version = "0.1.0" }
ember-actuator = { package = "ember-framework-actuator", path = "crates/ember-actuator", version = "0.1.0" }
ember-scheduler = { package = "ember-framework-scheduler", path = "crates/ember-scheduler", version = "0.1.0" }
ember-security = { package = "ember-framework-security", path = "crates/ember-security", version = "0.1.0" }
ember-web = { package = "ember-framework-web", path = "crates/ember-web", version = "0.1.0" }
http = "1"
inventory = "0.3"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
syn = { version = "2", features = ["full", "extra-traits"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
